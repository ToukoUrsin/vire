<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Vire</title>
    <meta name="description" content="Your AirPods sense every step. After TMS for depression, when you move less than usual, Vire guides a walk or slow breathing in your ears and learns which helps. If neither does, your clinic knows." />
    <meta name="theme-color" content="#faf6ef" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vire" />
    <link rel="icon" type="image/png" href="/app/icon-180.png" />
    <link rel="apple-touch-icon" href="/app/icon-180.png" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <style>
      html, body { margin: 0; height: 100%; background: #faf6ef; }
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; color: #12302b; font: 400 16px/1.4 -apple-system, system-ui, sans-serif; }
      .boot i { width: 14px; height: 14px; border-radius: 50%; background: #e4572e; animation: boot 1.6s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes boot { 0%, 100% { transform: scale(.8); opacity: .6 } 50% { transform: scale(1.25); opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
