app = "vire"
primary_region = "arn"

[build]

# one machine, one SQLite file: pings, doses, the day's generated sounds and the hall log survive a deploy
[mounts]
  source = "vire_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
